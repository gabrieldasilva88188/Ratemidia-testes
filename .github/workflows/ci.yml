name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 1) Qualidade + testes unitários e de integração + build
  build-and-test:
    name: Lint, tipos, unitários, integração e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes unitários
        run: npm run test:unit

      - name: Testes de integração
        run: npm run test:integration

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

      - name: Auditoria de dependências
        run: npm audit --audit-level=high
        continue-on-error: true

  # 2) Testes E2E no navegador (Playwright) contra o build de produção.
  #    O build é feito SEM Supabase (modo demonstração): dados previsíveis e nenhum banco real alterado.
  e2e:
    name: Testes E2E (Playwright)
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Instalar navegador (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Build (modo demonstração)
        run: npm run build

      - name: Testes E2E
        run: npm run test:e2e

      - name: Publicar relatório do Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

# Deploy: a Vercel faz o deploy automático ao conectar este repositório
# (previews em Pull Requests e produção na branch main).
